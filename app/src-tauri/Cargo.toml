[package]
name = "spaghetti-lab"
version = "2026.10.27-preview.1"
edition = "2021"

[lib]
name = "spaghetti_lab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Our own build: run the research models on this PC (lab_local.rs). Published builds never set this.
local-models = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
dirs = "6"
# Lab login and hosted analysis (lab_api.rs, lab_auth.rs, lab_remote.rs)
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "process", "fs", "macros", "rt"] }
futures-util = "0.3"

[dev-dependencies]
tiny_http = "0.12"
