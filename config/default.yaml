resolution:
  width: 1920
  height: 1080

# Fallback fps, used only when the video reports none (timestamps come from
# the video's own fps).
fps: 30
# auto = every round(video_fps / 30) frames (60 fps -> 2), so ~30 samples/s;
# an integer forces a fixed step.
sample_every_n_frames: auto

# ROI coordinates (confirmed from pixel inspection at 1920x1080).
# Videos are auto-resized to 1920x1080 before extraction.
rois:
  p1_health_bar:
    x1: 155
    y1: 112
    x2: 868
    y2: 142
  p2_health_bar:
    x1: 1052
    y1: 112
    x2: 1782
    y2: 142
  timer:
    x1: 920
    y1: 110
    x2: 1000
    y2: 180
  timer_digits:
    x1: 920
    y1: 115
    x2: 1000
    y2: 170
  p1_tension_bar:
    x1: 260
    y1: 1000
    x2: 750
    y2: 1040
  p2_tension_bar:
    x1: 1170
    y1: 1000
    x2: 1660
    y2: 1040
  # Combo counter (replanal/extractors/combo.py). The counter is drawn on the
  # attacker's HUD side. *_combo_counter = search area for the spelled-out
  # word ("two".."nine", 2-9 hits); *_combo_big = search area of the huge
  # two-digit counter shown from 10 hits on (tens + ones glyph, incl. the
  # zoom-in on each hit). Measured on set 17; the glyph slots inside these
  # ROIs are in combo.py (BIG_SLOTS), so move both together. The big ROIs
  # stop at y 935: below it streams often put their own logos/overlays (the
  # game draws only the tension/burst HUD there), and the matcher cuts the
  # bottom of tall glyph templates to fit (see _BigMatcher._slot).
  p1_combo_counter:
    x1: 180
    y1: 180
    x2: 900
    y2: 450
  p2_combo_counter:
    x1: 1100
    y1: 180
    x2: 1910
    y2: 450
  p1_combo_big:
    x1: 40
    y1: 0
    x2: 1360
    y2: 935
  p2_combo_big:
    x1: 860
    y1: 0
    x2: 1920
    y2: 935

health_bar:
  background_threshold: 80
  min_delta_pct: 0.005
  smoothing_window: 3
