[project]
name = "replanal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# VOD splitter (scripts/split_vod.py): player-name OCR, plus an ffmpeg binary
# for machines without ffmpeg on PATH
ocr = ["easyocr>=1.7", "imageio-ffmpeg>=0.4"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=7.0"]
# Opener service (server/opener_service): the opener chain on a CPU server. torch / torchvision
# come from the CPU wheel index (see server/opener_service/README.md); scikit-learn must match the
# version banner_reader_final.pkl was saved with
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
include = ["replanal*"]

[tool.setuptools.package-data]
# Reference screenshots for recognising Strive's menus (per UI language)
"replanal.strive_export" = ["refs/*/*.jpg", "refs/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
