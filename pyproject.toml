[project]
name = "replanal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# VOD splitter (scripts/split_vod.py): player-name OCR, plus an ffmpeg binary
# for machines without ffmpeg on PATH
ocr = ["easyocr>=1.7", "imageio-ffmpeg>=0.4"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["replanal*"]

[tool.setuptools.package-data]
# Reference screenshots for recognising Strive's menus (per UI language)
"replanal.strive_export" = ["refs/*/*.jpg", "refs/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
